.btn{

.section-title{margin:0;color:#b6c2d4;font-weight:800;font-size:13px;letter-spacing:.2px}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick{

 background:rgba(255,255,255,.035);display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:8px;font-size:13px;font-weight:750;transition:.18s ease

.quick:active{transform:scale(.98);background:rgba(255,255,255,.07)}
.social-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.social{
